spring:
  application:
    name: pulsepass
  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
